<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Dashboard FY 26-27</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light p-4">

<div class="container">
    <h2 class="text-center mb-4">Centre-Wise Monthly Transaction Dashboard</h2>
    
    <!-- Filter Section -->
    <div class="row mb-4">
        <div class="col-md-6 offset-md-3">
            <label for="divisionSelect" class="form-label fw-bold">Filter by Division:</label>
            <select id="divisionSelect" class="form-select">
                <option value="ALL">All Divisions</option>
            </select>
        </div>
    </div>

    <!-- Chart Section -->
    <div class="card p-3 shadow-sm mb-4">
        <canvas id="txnChart" height="100"></canvas>
    </div>
</div>

<script>
let rawData = [];
let chartInstance = null;

// Load Data
fetch('data.json')
    .then(response => response.json())
    .then(data => {
        rawData = data;
        populateDivisions();
        updateChart('ALL');
    });

function populateDivisions() {
    const divisions = [...new Set(rawData.map(item => item.division))].filter(Boolean);
    const select = document.getElementById('divisionSelect');
    divisions.forEach(div => {
        const opt = document.createElement('option');
        opt.value = div;
        opt.innerText = div;
        select.appendChild(opt);
    });

    select.addEventListener('change', (e) => {
        updateChart(e.target.value);
    });
}

function updateChart(selectedDivision) {
    const filteredData = selectedDivision === 'ALL' 
        ? rawData 
        : rawData.filter(item => item.division === selectedDivision);

    const labels = filteredData.map(item => item.centre_name).slice(0, 15); // Top 15 centres
    const totals = filteredData.map(item => item.total_txn).slice(0, 15);

    const ctx = document.getElementById('txnChart').getContext('2d');
    
    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Total Txn FY 26-27',
                data: totals,
                backgroundColor: 'rgba(54, 162, 235, 0.6)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
}
</script>
</body>
</html>
